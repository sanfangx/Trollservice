name: Build TrollService iOS (TrollStore IPA/TIPA)

on:
  push:
    branches: [ main, 'feature/**' ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache Pub Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-cache-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            pub-cache-${{ runner.os }}-

      - name: Install Host ldid & OpenSSL Headers
        run: |
          brew install ldid openssl@3

      - name: Compile & Fetch iOS arm64 Helpers (daemon_root_helper, ldid, fastPathSign)
        run: |
          IOS_SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          OPENSSL_PREFIX=$(brew --prefix openssl@3)
          mkdir -p build/helpers_ios

          # 1. 编译 daemon_root_helper (iOS arm64)
          xcrun -sdk iphoneos clang \
            -arch arm64 \
            -isysroot "$IOS_SDK" \
            -miphoneos-version-min=14.0 \
            -O2 -Wall -Wextra \
            ios/Helpers/spawn_root.c \
            ios/Helpers/daemon_root_helper.c \
            -o build/helpers_ios/daemon_root_helper

          # 2. 下载 iOS arm64 版 ldid（供 TrollService 在手机上为被安装的目标程序签名赋权）
          curl -fL "https://github.com/opa334/ldid/releases/latest/download/ldid" \
            -o build/helpers_ios/ldid
          chmod 755 build/helpers_ios/ldid

          # 3. 交叉编译 iOS arm64 版 fastPathSign（供 TrollService 在手机上为被安装的目标程序注入 CoreTrust 绕过签名）
          git clone --recurse-submodules --depth=1 https://github.com/opa334/TrollStore.git "$RUNNER_TEMP/TrollStore"
          xcrun -sdk iphoneos clang \
            -arch arm64 \
            -isysroot "$IOS_SDK" \
            -miphoneos-version-min=14.0 \
            -Wno-pointer-to-int-cast -Wno-unused-command-line-argument -Wno-deprecated-declarations \
            -I"$RUNNER_TEMP/TrollStore/Exploits/fastPathSign/src" \
            -I"$RUNNER_TEMP/TrollStore/ChOma/src" \
            -I"$OPENSSL_PREFIX/include" \
            ios/Helpers/fastPathSign_ios.c \
            "$RUNNER_TEMP/TrollStore/Exploits/fastPathSign/src/coretrust_bug.c" \
            "$RUNNER_TEMP/TrollStore/ChOma/src/"*.c \
            "$RUNNER_TEMP/TrollStore/ChOma/external/ios/libcrypto.a" \
            -framework CoreFoundation \
            -O2 -o build/helpers_ios/fastPathSign

      - name: Install Flutter Dependencies & Run Tests
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Build Flutter iOS App (No Codesign)
        run: |
          flutter build ios --release --no-codesign

      - name: Bundle On-Device Signing Tools & Embed Entitlements
        run: |
          APP_BUNDLE="build/ios/iphoneos/Runner.app"
          mkdir -p "$APP_BUNDLE/Helpers"

          # 将 iOS arm64 架构的 daemon_root_helper、ldid、fastPathSign 放入 Runner.app/Helpers/
          # 当用户在手机上用 TrollService 安装/更新服务程序（如 aistudio2api）时，
          # TrollService 会调用 Helpers/ldid 与 Helpers/fastPathSign 对目标程序执行赋权与 CoreTrust 注入
          cp build/helpers_ios/daemon_root_helper "$APP_BUNDLE/Helpers/"
          cp build/helpers_ios/ldid "$APP_BUNDLE/Helpers/"
          cp build/helpers_ios/fastPathSign "$APP_BUNDLE/Helpers/"
          chmod 755 "$APP_BUNDLE/Helpers/"*

          # 对 TrollService 自身新编译的组件使用 ldid -S 声明权限块（Helpers/ldid 来自 opa334 官方已含完整权限签名；用户用 TrollStore 安装 TrollService.ipa 时，由 TrollStore 自动完成对 TrollService 的签名）
          for helper in daemon_root_helper fastPathSign; do
            ldid -Sios/Helpers/RootHelper.entitlements "$APP_BUNDLE/Helpers/$helper"
          done
          ldid -Sios/Runner/Runner.entitlements "$APP_BUNDLE/Runner"

          # 打包为 .ipa 与 .tipa
          mkdir -p dist/Payload
          cp -R "$APP_BUNDLE" dist/Payload/
          (cd dist && zip -qr TrollService.ipa Payload)
          cp dist/TrollService.ipa dist/TrollService.tipa

      - name: Upload TrollService IPA & TIPA Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TrollService-TrollStore-Package
          path: |
            dist/TrollService.ipa
            dist/TrollService.tipa
          retention-days: 14
